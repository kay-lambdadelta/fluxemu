[package]
name = "fluxemu-program"
version = "0.0.1"
edition = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

[dependencies]
bytes = { workspace = true }
data-encoding = { workspace = true }
digest-io = { workspace = true }
fluxemu-locale = { workspace = true }
fluxemu-math = { workspace = true }
memmap2 = { workspace = true, optional = true }
opendal = { workspace = true, features = [
  "auto-register-services",
  "executors-tokio",
  "services-fs",
] }
redb = { workspace = true, optional = true }
rmp-serde = { workspace = true, optional = true }
ron = { workspace = true }
rustc-hash = { workspace = true }
scc = { workspace = true }
serde = { workspace = true }
serde_with = { workspace = true }
sha1 = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt"] }
tracing = { workspace = true }

[features]
mmap = ["dep:memmap2"]
redb = ["dep:redb", "dep:rmp-serde"]

[lints]
workspace = true
