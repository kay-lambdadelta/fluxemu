[package]
name = "fluxemu-frontend"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
byte-unit = "5.2"
egui = { workspace = true, features = ["rayon"] }
egui_extras = "0.36"
egui_material_icons = {
  version = "0.8",
  default-features = false,
  features = ["filled"]
}
egui-toast = {
  git = "https://github.com/kay-lambdadelta/egui-toast",
  rev = "94ca396b4cdf6287eb273fab983cc27ac2bdcf9f"
}
fluxemu-audio = { workspace = true }
fluxemu-environment = { workspace = true }
fluxemu-graphics = { workspace = true }
fluxemu-input = { workspace = true }
fluxemu-program = { workspace = true }
fluxemu-range = { workspace = true }
fluxemu-runtime = { workspace = true }
fluxemu-system = { workspace = true }
indexmap = { workspace = true }
itertools = { workspace = true }
nalgebra = { workspace = true }
num = { workspace = true }
palette = { workspace = true }
pollster = { workspace = true }
rand = { workspace = true }
rfd = { version = "0.17", optional = true }
ringbuffer = { workspace = true }
ron = { workspace = true }
rust-i18n = { workspace = true }
rustc-hash = { workspace = true }
scc = { workspace = true }
serde = { workspace = true }
strum = { workspace = true }
sysinfo = "0.39"
tracing = { workspace = true }
uuid = { workspace = true }
versions = { workspace = true }

[features]
external-file-dialog = ["dep:rfd"]
