[package]
name = "fluxemu-frontend"
version = "0.0.1"
edition = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

[dependencies]
bytemuck = { workspace = true }
fluxemu-audio = { workspace = true }
fluxemu-database = { workspace = true }
fluxemu-environment = { workspace = true }
fluxemu-graphics = { workspace = true }
fluxemu-input = { workspace = true }
fluxemu-math = { workspace = true }
fluxemu-platform = { workspace = true }
fluxemu-program = { workspace = true }
fluxemu-runtime = { workspace = true }
fluxemu-system = { workspace = true }
futures = { workspace = true }
image = { workspace = true, features = ["webp"] }
indexmap = { workspace = true }
naga = { workspace = true, optional = true, features = [
  "glsl-in",
  "glsl-out",
  "wgsl-in",
  "wgsl-out",
] }
nalgebra = { workspace = true }
palette = { workspace = true }
rand = { workspace = true }
ringbuffer = { workspace = true }
ron = { workspace = true }
rust-i18n = { workspace = true }
rust-i18n-macro = { workspace = true }
rust-i18n-support = { workspace = true }
scc = { workspace = true, optional = true }
serde = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "sync"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
filesystem = ["fluxemu-program/filesystem"]
shader-support = ["dep:naga", "dep:scc", "dep:thiserror"]

[lints]
workspace = true
