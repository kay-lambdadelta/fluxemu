[workspace]
resolver = "3"
members = [
  "definition/*",
  "lib/*",
  "shell/*",
  "system/*/*",
  "utils/",
]

[workspace.dependencies]
bit-vec = "0.10"
bitstream-io = "4.10"
byte-unit = "5.2"
bytemuck = { version = "1.25", features = ["derive"] }
bytes = "1.12"
clap = { version = "4.6", features = ["derive"] }
confique = "0.4"
cpal = "0.18"
criterion = "0.8"
csv = "1.4"
data-encoding = "2.11"
digest-io = "0.1"
dirs = "6.0"
drm = "0.15"
dyn-clone = "1.0"
egui = { version = "0.36", default-features = false }
egui_demo_lib = "0.36"
egui_extras = "0.36"
egui-toast = "0.22"
egui-wgpu = "0.36"
egui-winit = "0.36"
evdev = "0.13"
fixed = { version = "1.31", features = ["num-traits", "serde"] }
fontique = "0.11"
gilrs = "0.11"
heapless = { version = "0.9", features = ["serde"] }
indexmap = { version = "2.14", features = ["serde"] }
input = {
  version = "0.10",
  features = ["log"],
}
itertools = "0.15"
libc = "0.2"
libseat = "0.2"
lz4_flex = "0.14"
memmap2 = "0.9"
multiversion = "0.8"
nalgebra = {
  version = "0.35",
  features = [
    "convert-bytemuck",
    "serde-serialize",
  ]
}
nix = "0.31"
num = { version = "0.4", features = ["serde"] }
palette = { version = "0.7", features = ["bytemuck", "named", "serializing"] }
pollster = "1.0"
proc-macro2 = "1.0"
quick-xml = { version = "0.42", features = ["serialize"] }
quote = "1.0"
rand = "0.10"
rangemap = { version = "1.8", features = ["serde1"] }
rayon = "1.12"
redb = { version = "4.2", features = ["logging"] }
rfd = "0.17"
ringbuffer = "0.16"
rmp-serde = "1.3"
ron = "0.12"
rust-i18n = "4.2"
rustc-hash = "2.1"
scc = "3.8"
sdd = { version = "4.8" }
serde = { version = "1.0", features = ["derive"] }
serde_with = "3.22"
sevenz-rust2 = "0.21"
sha1 = "0.11"
sha2 = "0.11"
softbuffer = "0.4"
strum = { version = "0.28", features = ["derive"] }
syn = { version = "3.0", features = ["full"] }
sysinfo = "0.39"
tempfile = "3.27"
thin-vec = "0.2"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
udev = "0.9"
ureq = "3.4"
url = "2.5"
uuid = {
  version = "1.24",
  features = [
    "serde",
  ]
}
walkdir = "2.5"
wgpu = "30.0"
winit = "0.30"
xkbcommon = "0.9"
zip = "8.6"

fluxemu-audio = { path = "lib/audio" }
fluxemu-egui-software-renderer = { path = "lib/egui-software-renderer" }
fluxemu-environment = { path = "lib/environment" }
fluxemu-frontend = { path = "lib/frontend" }
fluxemu-graphics = { path = "lib/graphics" }
fluxemu-input = { path = "lib/input" }
fluxemu-locale = { path = "lib/locale" }
fluxemu-math = { path = "lib/math" }
fluxemu-program = { path = "lib/program" }
fluxemu-runtime = { path = "lib/runtime" }
fluxemu-system = { path = "lib/system" }

fluxemu-definition-intel8080 = { path = "definition/intel8080" }
fluxemu-definition-mos6502 = { path = "definition/mos6502" }
fluxemu-definition-mos6532 = { path = "definition/mos6532" }

fluxemu-system-atari-2600 = { path = "system/atari/2600" }
fluxemu-system-atari-lynx = { path = "system/atari/lynx" }
fluxemu-system-nintendo-gameboy = { path = "system/nintendo/gameboy" }
fluxemu-system-nintendo-nes = { path = "system/nintendo/nes" }
fluxemu-system-other-chip8 = { path = "system/other/chip8" }

# FIXME: Remove when getrandom 0.4.4 comes out
[patch.crates-io]
getrandom = { git = "https://github.com/rust-random/getrandom", rev = "4fbc7bc02b9a65beee4c72d4523010f388affce8" }

[profile.bench]
inherits = "profiling"

[profile.dev]
opt-level = 1

[profile.release]
lto = true
panic = "abort"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
