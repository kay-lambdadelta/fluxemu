[package]
name = "fluxemu-frontend-egui"
version = "0.0.1"
edition = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

[dependencies]
bytemuck = { workspace = true }
egui = { workspace = true, features = ["rayon"] }
egui-wgpu = { workspace = true, optional = true }
fluxemu-audio = { workspace = true }
fluxemu-egui-software-renderer = { workspace = true }
fluxemu-environment = { workspace = true }
fluxemu-frontend = { workspace = true }
fluxemu-graphics = { workspace = true }
fluxemu-input = { workspace = true }
fluxemu-math = { workspace = true }
fluxemu-program = { workspace = true }
fluxemu-runtime = { workspace = true }
fluxemu-system = { workspace = true }
indexmap = { workspace = true }
nalgebra = { workspace = true }
palette = { workspace = true }
rand = { workspace = true }
rfd = { workspace = true, optional = true }
ringbuffer = { workspace = true }
rust-i18n = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
jiff = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync"] }
tracing = { workspace = true }
uuid = { workspace = true }
wgpu = { workspace = true, optional = true }

[build-dependencies]
lucide-icons = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
read-fonts = { workspace = true }
skera = { workspace = true }

[features]
external-file-dialog = ["dep:rfd"]
webgpu = ["dep:egui-wgpu", "dep:wgpu"]

[lints]
workspace = true
