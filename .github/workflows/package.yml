name: "package"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian Trixie (x86_64-unknown-linux-gnu)
            runner: ubuntu-26.04
            container: debian:trixie
            platform: debian
            tools: cargo install cargo-deb --locked
            build: cargo deb -p fluxemu-shell-destinezite --features drm,ratatui-image/chafa-dyn --target x86_64-unknown-linux-gnu
            artifact_name: fluxemu-shell-destinezite-(debian-trixie-x86_64)-deb
            artifact_path: target/debian/fluxemu-shell-destinezite_*_amd64.deb

          - name: Debian Trixie (aarch64-unknown-linux-gnu)
            runner: ubuntu-26.04-arm
            container: debian:trixie
            platform: debian
            tools: cargo install cargo-deb --locked
            build: cargo deb -p fluxemu-shell-destinezite --features drm,ratatui-image/chafa-dyn --target aarch64-unknown-linux-gnu
            artifact_name: fluxemu-shell-destinezite-(debian-trixie-aarch64)-deb
            artifact_path: target/debian/fluxemu-shell-destinezite_*_arm64.deb

          - name: NuttX (raspberrypi-pico-2)
            runner: ubuntu-26.04
            container: debian:trixie
            platform: debian
            dependencies: nuttx
            shell: nuttallite
            tools: cargo install cargo-nuttx --locked
            build: cargo nuttx build --board raspberrypi-pico-2 --release
            artifact_name: fluxemu-shell-nuttallite-(raspberrypi-pico-2)-uf2
            artifact_path: target/nuttx/raspberrypi-pico-2/release/nuttx.uf2

          - name: Web (wasm32-unknown-emscripten)
            runner: ubuntu-26.04
            container: debian:trixie
            platform: debian
            dependencies: web
            shell: weberite
            emsdk: true
            tools: |
              cargo install wasm-bindgen-cli --locked --version "$(cargo pkgid wasm-bindgen | cut -d@ -f2)"
            build: |
              cargo build -p fluxemu-shell-weberite --target wasm32-unknown-emscripten --release
              mkdir -p target/weberite-site
              cp shell/weberite/web/index.html \
                external/coi-serviceworker/coi-serviceworker.js \
                target/wasm32-unknown-emscripten/release/fluxemu-shell-weberite.js \
                target/wasm32-unknown-emscripten/release/fluxemu_shell_weberite.wasm \
                target/weberite-site/
            artifact_name: fluxemu-shell-weberite-(web)
            artifact_path: target/weberite-site
            pages: true

          - name: Windows (x86_64-pc-windows-msvc)
            runner: windows-latest
            platform: windows
            build: cargo build -p fluxemu-shell-destinezite --release
            artifact_name: fluxemu-shell-destinezite-(windows-x86_64)-portable
            artifact_path: target/release/fluxemu-shell-destinezite.exe

    steps:
      - name: Install checkout dependencies
        if: matrix.platform == 'debian'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git

      - uses: actions/checkout@v7
        with:
          submodules: "true"

      - uses: ./.github/actions/setup
        with:
          platform: ${{ matrix.platform }}
          dependencies: ${{ matrix.dependencies }}
          shell: ${{ matrix.shell }}
          emsdk: ${{ matrix.emsdk }}

      - name: Install tools
        if: matrix.tools
        run: ${{ matrix.tools }}

      - name: Build
        run: ${{ matrix.build }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

      - name: Upload Pages artifact
        if: matrix.pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ matrix.artifact_path }}

  pages:
    name: Deploy to GitHub Pages
    needs: package
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
