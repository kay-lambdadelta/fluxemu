name: "package"

on:
  push:
    paths:
      - ".github/workflows/package.yml"

  schedule:
    - cron: "0 0 * * *"

jobs:
  debian-trixie-x86_64:
    name: Debian Trixie (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install Linux dependencies
        run: |
          apt update
          apt install -y --no-install-recommends \
            rustup \
            ca-certificates \
            curl \
            git \
            build-essential \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libvulkan-dev \
            libgl-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libinput-dev \
            libseat-dev \
            libbz2-dev \
            libfontconfig-dev

      - uses: actions/checkout@v7
        with:
          submodules: "true"

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build Debian package
        run: cargo deb -p fluxemu-shell-destinezite --features drm --target x86_64-unknown-linux-gnu

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: fluxemu-shell-destinezite-x86_64-unknown-linux-gnu-deb
          path: target/debian/fluxemu-shell-destinezite_*_amd64.deb
          if-no-files-found: error

  apache-nuttx-raspberrypi-pico-2:
    name: Apache NuttX Raspberry Pi Pico 2 (thumbv8m.main-nuttx-eabihf)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install Linux dependencies
        run: |
          apt update
          apt install -y --no-install-recommends \
            rustup \
            ca-certificates \
            curl \
            unzip \
            git \
            libclang-dev \
            build-essential \
            rsync \
            jq \
            kconfig-frontends \
            gcc-arm-none-eabi \
            picotool

      - uses: actions/checkout@v7
        with:
          submodules: "true"

      - uses: Swatinem/rust-cache@v2

      - name: Force a rustup default
        run: rustup default stable

      - name: Install cargo-nuttx
        run: cargo install --git https://github.com/kay-lambdadelta/cargo-nuttx

      - name: Setup nightly config
        run: rm rust-toolchain.toml && ln -s shell/nuttallite/rust-toolchain.toml ./rust-toolchain.toml

      - name: Build nuttallite
        run: cargo +nightly nuttx --board raspberrypi-pico-2 --board-config nsh build -p fluxemu-shell-nuttallite --download --release -- -j$(nproc)

      - name: Upload NuttX firmware image
        uses: actions/upload-artifact@v7
        with:
          name: fluxemu-shell-nuttallite-raspberrypi-pico-2
          path: target/nuttx/raspberrypi-pico-2/release/nuttx.uf2
          if-no-files-found: error
