name: "build"

on:
  push:
  pull_request:

jobs:
  debian-trixie-x86_64:
    name: Debian Trixie (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install Linux dependencies
        run: |
          apt update
          apt install -y --no-install-recommends \
            rustup \
            ca-certificates \
            curl \
            git \
            build-essential \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libvulkan-dev \
            libgl-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libinput-dev \
            libseat-dev \
            libbz2-dev \
            libfontconfig-dev

      - uses: actions/checkout@v7
        with:
          submodules: "true"

      - name: Build destinezite
        run: cargo build -p fluxemu-shell-destinezite --all-features

      - name: Build utils
        run: cargo build -p fluxemu-utils

      - name: Test
        run: cargo test --all-features

  apache-nuttx-raspberrypi-pico-2:
    name: Apache NuttX Raspberry Pi Pico 2 (thumbv8m.main-nuttx-eabihf)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install Linux dependencies
        run: |
          apt update
          apt install -y --no-install-recommends \
            rustup \
            ca-certificates \
            curl \
            unzip \
            git \
            libclang-dev \
            build-essential \
            rsync \
            jq \
            kconfig-frontends \
            gcc-arm-none-eabi \
            picotool

      - uses: actions/checkout@v7
        with:
          submodules: "true"

      - name: Force a rustup default
        run: rustup default stable

      - name: Setup rust nightly
        run: |
          rustup install nightly
          rustup component add rust-src --toolchain nightly

      - name: Install cargo-nuttx
        run: cargo install --git https://github.com/kay-lambdadelta/cargo-nuttx

      - name: Build nuttallite
        run: cargo +nightly nuttx --board raspberrypi-pico-2 --board-config nsh build -p fluxemu-shell-nuttallite --download --release -- -j$(nproc)
