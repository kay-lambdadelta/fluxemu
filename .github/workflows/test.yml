name: "build"

on:
  push:
  pull_request:

jobs:
  cargo-deny:
    name: Run cargo-deny
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: error

  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian Trixie (x86_64-unknown-linux-gnu)
            runner: ubuntu-26.04
            container: debian:trixie
            platform: debian
            check: |
              cargo clippy -p fluxemu-shell-destinezite --all-features
              cargo clippy -p fluxemu-utils
            test: RUSTFLAGS="-C opt-level=0" cargo test

          - name: Debian Trixie (aarch64-unknown-linux-gnu)
            runner: ubuntu-26.04-arm
            container: debian:trixie
            platform: debian
            check: |
              cargo clippy -p fluxemu-shell-destinezite --all-features
              cargo clippy -p fluxemu-utils
            test: RUSTFLAGS="-C opt-level=0" cargo test

    steps:
      - name: Install checkout dependencies
        if: matrix.platform == 'debian'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git

      - uses: actions/checkout@v7
        with:
          submodules: "true"

      - uses: ./.github/actions/setup
        with:
          platform: ${{ matrix.platform }}

      - name: Check
        run: ${{ matrix.check }}

      - name: Test
        if: matrix.test
        run: ${{ matrix.test }}
