name: "build"

on:
  push:
  pull_request:

jobs:
  cargo-deny:
    name: Run cargo-deny
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: error

  debian-trixie-x86_64:
    name: Debian Trixie (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install Linux dependencies
        run: |
          apt update
          apt install -y --no-install-recommends \
            rustup \
            ca-certificates \
            curl \
            git \
            build-essential \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libvulkan-dev \
            libgl-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libinput-dev \
            libseat-dev \
            libbz2-dev \
            libfontconfig-dev \
            libchafa-dev

      - uses: actions/checkout@v7
        with:
          submodules: "true"

      - uses: Swatinem/rust-cache@v2

      - name: Check destinezite
        run: cargo clippy -p fluxemu-shell-destinezite --all-features

      - name: Check utils
        run: cargo clippy -p fluxemu-utils

      - name: Test
        run: RUSTFLAGS="-C opt-level=0" cargo test
