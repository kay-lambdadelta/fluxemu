name: "build"

on:
  push:
  pull_request:

jobs:
  cargo-deny:
    name: Run cargo-deny
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: error

  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian Trixie (x86_64-unknown-linux-gnu)
            runner: ubuntu-26.04
            container: debian:trixie
            platform: debian
            check: |
              cargo clippy -p fluxemu-shell-destinezite --all-features
              cargo clippy -p fluxemu-utils
            test: cargo nextest run --workspace --exclude 'fluxemu-shell-*'

          - name: Debian Trixie (aarch64-unknown-linux-gnu)
            runner: ubuntu-26.04-arm
            container: debian:trixie
            platform: debian
            check: |
              cargo clippy -p fluxemu-shell-destinezite --all-features
              cargo clippy -p fluxemu-utils
            test: cargo nextest run --workspace --exclude 'fluxemu-shell-*'

          - name: NuttX (raspberrypi-pico-2)
            runner: ubuntu-26.04
            container: debian:trixie
            platform: debian
            dependencies: debian-nuttx
            shell: nuttallite
            tools: cargo install cargo-nuttx --locked
            check: cargo nuttx clippy --board raspberrypi-pico-2 --release

    steps:
      - name: Install checkout dependencies
        if: matrix.platform == 'debian'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git

      - uses: actions/checkout@v7
        with:
          submodules: "true"

      - uses: ./.github/actions/setup
        with:
          platform: ${{ matrix.platform }}
          dependencies: ${{ matrix.dependencies }}
          shell: ${{ matrix.shell }}

      - name: Install tools
        if: matrix.tools
        run: ${{ matrix.tools }}

      - name: Install cargo-nextest
        if: matrix.test
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Check
        run: ${{ matrix.check }}

      - name: Test
        if: matrix.test
        run: ${{ matrix.test }}
