[target.wasm32-unknown-emscripten]
rustflags = [
  "-Ctarget-feature=+atomics",
  "-Cpanic=abort",
  "-Clink-arg=-pthread",
  "-Clink-arg=-sPTHREAD_POOL_SIZE=navigator.hardwareConcurrency",
  "-Clink-arg=-sALLOW_MEMORY_GROWTH",
  "-Clink-arg=-sSTACK_SIZE=8388608",
  "-Clink-arg=-sWASMFS",
  "-Clink-arg=-sWASM_BINDGEN",
]

[unstable]
build-std = ["std", "panic_abort"]
