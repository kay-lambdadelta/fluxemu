<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>FluxEMU</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #000;
            }

            canvas {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: contain;
                image-rendering: pixelated;
            }

            #open-rom {
                position: fixed;
                top: 8px;
                left: 8px;
            }
        </style>
    </head>
    <body>
        <button id="open-rom">Open ROM</button>
        <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
        <script>
            var Module = {
                canvas: document.getElementById("canvas"),
                print: (text) => console.log(text),
                printErr: (text) => console.error(text),
            };
        </script>
        <script src="fluxemu-shell-weberite.js"></script>
    </body>
</html>
