<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>FluxEMU</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <button id="open-rom">Open ROM</button>
        <table id="debug-overlay" hidden>
            <tr>
                <th scope="row">Execution timeslice</th>
                <td id="debug-overlay-execution-timeslice"></td>
            </tr>
            <tr>
                <th scope="row">Target timeslice</th>
                <td id="debug-overlay-target-timeslice"></td>
            </tr>
            <tr>
                <th scope="row">Realtime throughput factor</th>
                <td id="debug-overlay-hardware-speed"></td>
            </tr>
            <tr>
                <th scope="row">Jitter ratio</th>
                <td id="debug-overlay-jitter-ratio"></td>
            </tr>
        </table>
        <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
        <script src="coi-serviceworker.js"></script>
        <script>
            var Module = {
                canvas: document.getElementById("canvas"),
                print: (text) => console.log(text),
                printErr: (text) => console.error(text),
            };
        </script>
        <script src="fluxemu-shell-weberite.js"></script>
    </body>
</html>
