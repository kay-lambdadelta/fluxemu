[package]
name = "fluxemu-shell-destinezite"
version = "0.0.1"
edition = { workspace = true }
rust-version = { workspace = true }
description = "Desktop port of the FluxEMU emulation framework"
repository = { workspace = true }
license = { workspace = true }

[package.metadata.deb]
maintainer = "Kay <lambdadeltakay@proton.me>"
license-file = ["../../LICENSE", "0"]
assets = [
  ["target/release/fluxemu-shell-destinezite", "usr/bin/", "755"],
  ["assets/linux/launch.desktop", "usr/share/applications/fluxemu-shell-destinezite-launch.desktop", "644"],
  ["assets/linux/run.desktop", "usr/share/applications/fluxemu-shell-destinezite-run.desktop", "644"],
  ["assets/linux/mime.xml", "usr/share/mime/packages/fluxemu-shell-destinezite.xml", "644"],
]
section = "games"
priority = "optional"
depends = ["$auto", "fonts-noto"]
maintainer-scripts = "assets/linux/debian"

[dependencies]
bytemuck = { workspace = true }
clap = { workspace = true }
cpal = { workspace = true }
digest-io = { workspace = true }
egui = { workspace = true }
fluxemu-audio = { workspace = true }
fluxemu-egui-software-renderer = { workspace = true }
fluxemu-environment = { workspace = true }
fluxemu-frontend = { workspace = true }
fluxemu-graphics = { workspace = true }
fluxemu-input = { workspace = true }
fluxemu-program = { workspace = true, features = ["mmap"] }
fluxemu-runtime = { workspace = true }
fontique = { workspace = true }
gilrs = { workspace = true }
nalgebra = { workspace = true }
palette = { workspace = true }
pollster = { workspace = true }
redb = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

# Webgpu required stuff
egui-wgpu = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

# Windowing required stuff
egui-winit = { workspace = true, optional = true }
softbuffer = { workspace = true, optional = true }
winit = { workspace = true, optional = true }

# DRM required stuff
drm = { workspace = true, optional = true }
evdev = { workspace = true, optional = true }
input = { workspace = true, optional = true }
libseat = { workspace = true, optional = true }
nix = { workspace = true, features = ["event", "poll"], optional = true }
udev = { workspace = true, optional = true }
xkbcommon = { workspace = true, optional = true }

# Machines
fluxemu-system-atari-2600 = {
  workspace = true,
}
fluxemu-system-atari-lynx = {
  workspace = true,
}
fluxemu-system-nintendo-gameboy = {
  workspace = true,
}
fluxemu-system-nintendo-nes = {
  workspace = true,
}
fluxemu-system-other-chip8 = {
  workspace = true,
}

[features]
default = ["webgpu", "windowing"]
drm = ["dep:drm", "dep:evdev", "dep:input", "dep:libseat", "dep:nix", "dep:udev", "dep:xkbcommon", "wgpu/drm"]
webgpu = [
  "dep:egui-wgpu",
  "dep:wgpu",
  "fluxemu-graphics/webgpu",
  "fluxemu-system-atari-2600/webgpu",
  "fluxemu-system-atari-lynx/webgpu",
  "fluxemu-system-nintendo-gameboy/webgpu",
  "fluxemu-system-nintendo-nes/webgpu",
  "fluxemu-system-other-chip8/webgpu",
]
windowing = ["dep:egui-winit", "dep:softbuffer", "dep:winit", "fluxemu-frontend/external-file-dialog"]
