[package]
name = "fluxemu-shell-nuttallite"
version = "0.0.1"
edition = { workspace = true }
rust-version = { workspace = true }
description = "Apache NuttX port of the FluxEMU emulation framework"
repository = { workspace = true }
license = { workspace = true }

[package.metadata.nuttx]
priority = 100
stack-size = 16384
nuttx-version = "13.1.1"

[package.metadata.nuttx.boards.pimoroni-pico-2-plus]
board-config = "smp"
target = "thumbv8m.main-nuttx-eabihf"
target-cpu = "cortex-m33"
opt-level = "3"
firmware-file = "nuttx.uf2"
runner = ["picotool", "load", "-x"]

[package.metadata.nuttx.boards."teensy-4.x"]
board-config = "lcd-4.1"
target = "thumbv7em-nuttx-eabihf"
target-cpu = "cortex-m7"
# This is a tight fit. When adding major pieces of code that will be linked in, ensure it still builds for this board
opt-level = "3"
firmware-file = "nuttx.hex"
runner = ["teensy_loader_cli", "--mcu=TEENSY41", "-w", "-v"]

[package.metadata.nuttx.boards.esp32p4-pico-wifi-waveshare]
target = "riscv32imac-unknown-nuttx-elf"
opt-level = "3"
firmware-file = "nuttx.bin"
# My board survives this baud rate, if this breaks yours, open an issue
runner = ["espflash", "write-bin", "--baud", "1500000", "--chip", "esp32p4", "0x2000"]

# NOTE: Rust's support for nuttx has no x86 stuff wired up, so we hardcode to aarch64 here
#
# If you are on a x86 machine, install qemu-user and enable multilib on your distro, then install `libx11-dev:arm64 libxext-dev:arm64`
[package.metadata.nuttx.boards.sim]
target = "aarch64-unknown-nuttx"
firmware-file = "nuttx"
runner = ["env"]

[lib]
crate-type = ["staticlib"]

[dependencies]
egui = { workspace = true, optional = true }
fluxemu-audio = { workspace = true }
fluxemu-database = { workspace = true }
fluxemu-environment = { workspace = true }
fluxemu-frontend = { workspace = true }
fluxemu-frontend-egui = { workspace = true, optional = true }
fluxemu-frontend-ratatui = { workspace = true, optional = true }
fluxemu-graphics = { workspace = true }
fluxemu-input = { workspace = true }
fluxemu-math = { workspace = true }
fluxemu-paths = { workspace = true }
fluxemu-platform = { workspace = true }
fluxemu-program = { workspace = true }
fluxemu-runtime = { workspace = true }
libc = { workspace = true }
nalgebra = { workspace = true }
# IMPORTANT: Do not turn on `auto-register-services`. It causes TLS corruption in the Rust std on NuttX
#
# This will be very difficult to debug if you do
opendal = { workspace = true }
palette = { workspace = true }
redb = { workspace = true }
ringbuffer = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

# Machines
fluxemu-system-atari-2600 = {
  workspace = true,
}
fluxemu-system-nintendo-nes = {
  workspace = true,
}
fluxemu-system-other-chip8 = {
  workspace = true,
}

[build-dependencies]
bindgen = { workspace = true }
read-fonts = { workspace = true }
skera = { workspace = true }

[features]
default = ["egui"]
egui = ["dep:egui", "dep:fluxemu-frontend-egui"]
ratatui = ["dep:fluxemu-frontend-ratatui"]

[lints]
workspace = true
